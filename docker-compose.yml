# Placeholder compose file (SCRUM-38). Runs the API, the web app and an MLflow server.
# Dockerfiles for backend/ and frontend/ are still TODO.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    env_file: ./frontend/.env.local
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
